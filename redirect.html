<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=https://domislink.com">
    <meta name="robots" content="noindex">
    <title>Redirecting to DomisLink...</title>
    <link rel="canonical" href="https://domislink.com">
    <script>window.location.replace("https://domislink.com" + window.location.pathname);</script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: #0a0a0a; 
            color: #fff; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            text-align: center;
        }
        .container { padding: 40px; }
        .logo { font-size: 3rem; margin-bottom: 20px; }
        h1 { font-size: 2rem; margin-bottom: 15px; color: #EEFF00; }
        p { color: #888; margin-bottom: 25px; }
        a { 
            display: inline-block;
            padding: 15px 40px; 
            background: #EEFF00; 
            color: #000; 
            text-decoration: none; 
            border-radius: 10px; 
            font-weight: 600;
        }
        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid #222;
            border-top-color: #EEFF00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🚀</div>
        <h1>Redirecting to DomisLink</h1>
        <div class="loader"></div>
        <p>You are being redirected to our main website...</p>
        <a href="https://domislink.com">Click here if not redirected</a>
    </div>
</body>
</html>
